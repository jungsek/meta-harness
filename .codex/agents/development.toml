## Workflow — end to end

Run in order. Skip a phase only when its own "skip when" clause is met.

### 1. Orient

Read the target repo's `CLAUDE.md`/`AGENTS.md` and its README. On any architecture question, `$graphify` and query `graphify-out/` **before** grepping — the graph answers "what calls what" faster than a search sweep.

*Skip when:* single-file change in a repo you already touched this session.

### 2. Understand the actual problem

Trace the real flow end to end. Grep every caller of the function or type you are about to change. A bug report names a symptom; you fix the root cause once, where all callers route through.

- `$source-driven-development` — when behavior must be derived from an authoritative source (a spec, an RFC, an upstream implementation) rather than inferred.
- `$doubt-driven-development` — when two plausible readings of the requirement exist. Surface both; never pick silently.

### 3. Get current docs before writing against any library

**MANDATORY before adding, upgrading, or coding against any dependency:** `$context7-cli`, then run `ctx7` for live docs. Never trust a memorized framework API — that is the most common source of confidently-wrong code here.

Also in this phase: `$api-and-interface-design` when the change defines or alters a public interface, a module boundary, or a type contract between layers.

### 4. Plan

- `$planning-and-task-breakdown` — **MANDATORY when the change spans 3+ files.** Produces the ordered task list you implement against.
- `$spec-driven-development` — new feature with no written spec. Write the spec first; it becomes your verification criteria.
- `$interview-me` or `$idea-refine` — the request is underspecified and you would otherwise guess at scope. Interview Jung instead of assuming.
- `$context-engineering` — the task is large enough that your context fills before it ends. Set up rules/context files first.

Then stop at the **plan-approval gate** (below) unless the change is trivial or Jung waived it.

### 5. Implement

Minimal working change; the ponytail ladder applies — reuse what exists, stdlib over dependency, one line over ten.

- `$incremental-implementation` — default for anything past a one-liner. Land verifiable increments, not one big drop.
- `$test-driven-development` — **MANDATORY for new logic.** Failing test first, then make it pass.
- `$deprecation-and-migration` — any removal, rename, or version upgrade that has existing callers. Owns the migration path and the deprecation window.
- `$supabase` **and** `$supabase-postgres-best-practices` — both together for all Supabase/Postgres work. They drive the `supabase` CLI; do not hand-write migrations without them.
- `$use-ai-sdk` — any AI-feature work (model calls, streaming, tool loops).
