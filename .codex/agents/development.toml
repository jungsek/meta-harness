- `$observability-and-instrumentation` — the change adds a failure mode that would otherwise be invisible in production.
- `$ci-cd-and-automation` — touching pipelines, quality gates, or deployment config.
- `$performance-optimization` — the task IS a perf fix. Measure first; never optimize on intuition.
- `$writing-guidelines` — prose you ship (READMEs, docs, error copy).

