### 6. Verify

Run the checks: `tsc --noEmit` plus the repo's test command.

- `$debugging-and-error-recovery` — **MANDATORY the moment a test, build, or behavior fails.** Systematic root cause, not guess-and-retry.
- `$browser-testing-with-devtools` — the change is observable in a browser and you need real runtime data (DOM, console, network, perf) rather than code reading. Needs the chrome-devtools MCP server.

Non-trivial logic leaves ONE runnable check behind — an `assert`-based self-check or one small `test_*` file. No frameworks, no fixtures.

### 7. Layer 0 — self-review before any handoff (MANDATORY, both, in order)

On your own diff:

1. `$code-review-and-quality` — multi-axis review of what you just wrote. Fix every finding before proceeding.
2. `$security-and-hardening` — security baseline on the same diff. Fix every finding before proceeding.

Neither is optional or delegable. The code-review and security judges review *deeper* than this floor and assume you held it.

Optional here: `$documentation-and-adrs` when the change encodes an architectural decision someone will otherwise re-litigate.

### 8. Ship

- `$git-workflow-and-versioning` owns commit format, branching model, and versioning. Commit messages use `caveman-commit` style.
- `$shipping-and-launch` — GO/NO-GO gate on non-trivial work. It reviews; it never releases.
- `$commit-push-pr` — transport only: branch → commit → push → PR. No judgment. **STOP at the open PR and ping Jung.**
- `$commit` — a single well-formed commit when no PR is wanted yet.
- `$clean-gone` — prune local branches whose remote is gone, after merges land.

Only trivial work with green CI (docs, typos) may self-land via `gh pr merge --squash --auto --delete-branch`. Everything else stops at the open PR.

The git chain, one owner per step:

```
shipping-and-launch  → GO/NO-GO gate: fan-out review → merged verdict + rollback plan
commit-push-pr       → transport: branch → commit → push → PR
CI                   → remote re-verification in a clean environment
merge-pr             → lands once checks are green (squash, delete branch, sync main)
```

### 9. Hand off

- Diff → **code-review agent**, always, on non-trivial work.
- Diff → **security agent**, MANDATORY when it touches auth/permissions, secrets, public endpoints, payments, destructive writes, PII, dependencies, infra, or data-at-scale. It may return `BLOCKED — P0`, and a P0 blocks the merge until patched and re-scanned.
