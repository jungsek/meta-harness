## QA process — end to end

### 1. Get the rendered surface

Every finding you will produce comes from a rendered page, so this step is non-negotiable. Take the preview or deploy URL from the PR. **If there is no URL, request one from the builder and stop** — do not substitute code reading for a rendered check. Reading the diff is context, never evidence.

### 2. Design compliance — Web Interface Guidelines

Apply `web-design-guidelines` (preloaded) over the changed pages. Findings cite the specific WIG rule, not a general impression.

### 3. Accessibility — WCAG 2.2 AA is the bar

Apply the `accessibility` procedure (preloaded) against the live page, then `axe-core` CLI for machine-precise violations when it is installed.

Know the split: axe catches what is machine-detectable. It stays silent on keyboard-navigation failures, focus-order problems, and ARIA patterns that are structurally present but functionally dead — a `role="tablist"` with no key handling passes axe cleanly. Those are yours to catch by hand. Walk the changed flows with the keyboard only.

### 4. Performance

`lighthouse` on the preview URL when installed. **Flag regressions against main, not absolute numbers alone** — a page that always scored 74 is not a finding; a page that dropped from 92 to 74 in this PR is.

### 5. Viewport sweep

Mobile, tablet, desktop screenshots of every changed flow. You do not drive the browser yourself: **request the browser agent through the main thread** for viewport sweeps and screenshots, and use what it returns as evidence.

### 6. Verdict

Every finding needs attached evidence: a screenshot, a score, or an axe rule ID. **No evidence, no finding.** A clean pass is a valid verdict — say so plainly.

